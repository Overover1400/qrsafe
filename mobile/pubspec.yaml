name: qrsafe_mobile
description: "QRSafe — scan QR codes safely."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.0
  # HTTP client
  dio: ^5.4.0
  # Secure storage for the guest JWT
  flutter_secure_storage: ^9.0.0
  # QR scanning (ML Kit on Android)
  mobile_scanner: ^5.0.0
  # Launch URLs in the system browser
  url_launcher: ^6.2.0
  # Declarative routing
  go_router: ^14.0.0
  # Receives the qrsafe:// sign-in deep link
  app_links: ^7.2.2
  # SVG rendering (icons, if needed)
  flutter_svg: ^2.0.0
  # Client-side QR rendering (static codes render offline; dynamic encode redirect_url)
  # Already present as a transitive dependency of pdf; named here because
  # the barcode generator imports it directly.
  barcode: ^2.2.8
  qr_flutter: ^4.1.0
  # Save downloaded QR PNGs to device storage
  path_provider: ^2.1.0
  # Share the rendered QR image to other apps
  share_plus: ^10.0.0
  # Pure-Dart PDF writer for the print-ready export
  pdf: ^3.11.0
  # Native document scanner (ML Kit on Android): edge detection + crop UI
  cunning_document_scanner: ^3.1.0
  permission_handler: ^12.0.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Mocking for unit/widget tests
  mocktail: ^1.0.0
  # Generates the Android launcher icons from assets/icon/
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launcher icon: a scanner frame around a QR glyph on the teal gradient.
# Regenerate with `dart run flutter_launcher_icons` after changing the source
# images (drawn by tool/make_icon.py).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E7C8A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
