name: qrsafe_mobile
description: "QRSafe — scan QR codes safely."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.0
  # HTTP client
  dio: ^5.4.0
  # Secure storage for the guest JWT
  flutter_secure_storage: ^9.0.0
  # QR scanning (ML Kit on Android)
  mobile_scanner: ^5.0.0
  # Launch URLs in the system browser
  url_launcher: ^6.2.0
  # Declarative routing
  go_router: ^14.0.0
  # SVG rendering (icons, if needed)
  flutter_svg: ^2.0.0
  # Client-side QR rendering (static codes render offline; dynamic encode redirect_url)
  qr_flutter: ^4.1.0
  # Save downloaded QR PNGs to device storage
  path_provider: ^2.1.0
  # Share the rendered QR image to other apps
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Mocking for unit/widget tests
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
