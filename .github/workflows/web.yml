name: Build Web

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/web.yml'
      # Skip doc-only changes — Markdown under mobile/ doesn't affect the build.
      - '!mobile/**.md'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/**.md'
  workflow_dispatch:

jobs:
  build-web:
    name: Build Flutter web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # Bake the production API URL in, same as the APK build. Without this the
        # web app falls back to the emulator-localhost default and can't reach
        # the API.
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.qrsafe.flemby.com

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: qrsafe-web
          path: mobile/build/web
          retention-days: 30

  # Re-trigger: deploy key rotated 2026-06-01.
  deploy-web:
    name: Deploy to app.qrsafe.flemby.com
    needs: build-web
    runs-on: ubuntu-latest
    # Only deploy real pushes to main — never PRs or other branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: qrsafe-web
          path: web

      - name: Add server to known_hosts
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          # Pin the server's host key from the secret, and also scan it live as a
          # fallback so the file is never empty. Both write to the same path that
          # the rsync ssh option points at below.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          ssh-keyscan -t ed25519 193.181.211.239 >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "known_hosts contents:"; cat "$HOME/.ssh/known_hosts"

      - name: Install deploy SSH key
        run: |
          install -m 600 /dev/stdin "$HOME/.ssh/deploy_key" <<< "${{ secrets.DEPLOY_SSH_KEY }}"

      - name: Rsync build to server
        # Trailing slash on web/ uploads the directory contents (not the dir
        # itself). --delete removes files no longer in the build so stale assets
        # don't linger. The server-side key is locked to
        # `rrsync -wo /var/www/qrsafe-web`, so the path after the colon is
        # relative to that web root.
        #
        # Use $HOME (shell-expanded here, before rsync runs) rather than ~ inside
        # the quoted ssh option, and pass UserKnownHostsFile +
        # StrictHostKeyChecking=accept-new together so there's no ambiguity about
        # which known_hosts ssh consults — this fixes "Host key verification
        # failed".
        run: |
          rsync -rlzv --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new" \
            web/ deploy@193.181.211.239:
