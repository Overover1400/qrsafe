name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      # Skip doc-only changes — Markdown under mobile/ doesn't affect the build.
      - '!mobile/**.md'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/**.md'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so CI matches the version the code is developed against.
          # On "stable" alone a new release can fail the build on a day no one
          # touched the app.
          flutter-version: 3.44.0
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Repeat each finding as a workflow error. Log files need a sign-in to
        # read; annotations do not, so a failure here can be diagnosed from the
        # run summary alone.
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "^ +(error|warning|info)" analyze.txt | while read -r line; do
              echo "::error::$line"
            done
          fi
          exit $status

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        # Bake the production API URL into the CI artifact. Local dev uses the
        # emulator-localhost default in lib/core/config/env.dart.
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.qrsafe.flemby.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrsafe-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
