name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      # Skip doc-only changes — Markdown under mobile/ doesn't affect the build.
      - '!mobile/**.md'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/**.md'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so CI matches the version the code is developed against.
          # On "stable" alone a new release can fail the build on a day no one
          # touched the app.
          flutter-version: 3.44.0
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Read the app version
        id: version
        # pubspec is the single source of truth for the version. Reading it
        # here and passing it into every build keeps the Settings screen
        # honest without anyone remembering to edit a constant.
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Repeat each finding as a workflow error. Log files need a sign-in to
        # read; annotations do not, so a failure here can be diagnosed from the
        # run summary alone.
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "^ +(error|warning|info)" analyze.txt | while read -r line; do
              echo "::error::$line"
            done
          fi
          exit $status

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        # Bake the production API URL into the CI artifact. Local dev uses the
        # emulator-localhost default in lib/core/config/env.dart.
        # Gradle's failure text lives in the log, which needs a sign-in to read.
        # Keep it and re-emit the tail as an annotation, which does not.
        run: |
          set -o pipefail
          if ! flutter build apk --debug --dart-define=API_BASE_URL=https://api.qrsafe.flemby.com --dart-define=APP_VERSION=${{ steps.version.outputs.value }} 2>&1 | tee build-debug.log; then
            # %25 first, or the %0A we add next would itself be escaped.
            message=$(tail -n 80 build-debug.log | sed -e 's/%/%25/g' | sed -z -e 's/\n/%0A/g')
            echo "::error title=Debug APK build failed::$message"
            exit 1
          fi

      - name: Build release per-ABI APKs
        # What she actually installs. A debug APK carries every architecture
        # and the debug machinery, which lands near 90 MB — too big to send
        # over Telegram. The release arm64 slice is a fraction of that. It is
        # signed with the debug key unless the upload key is configured (see
        # android/app/build.gradle.kts), so it sideloads but is not Play-ready.
        # Gradle's failure text lives in the log, which needs a sign-in to read.
        # Keep it and re-emit the tail as an annotation, which does not.
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://api.qrsafe.flemby.com --dart-define=APP_VERSION=${{ steps.version.outputs.value }} 2>&1 | tee build-release.log; then
            # %25 first, or the %0A we add next would itself be escaped.
            message=$(tail -n 80 build-release.log | sed -e 's/%/%25/g' | sed -z -e 's/\n/%0A/g')
            echo "::error title=Release APK build failed::$message"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrsafe-debug-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

  build-aab:
    name: Build signed Play bundle
    runs-on: ubuntu-latest
    # Real pushes to main only — never a PR from a fork, which must not see
    # the signing key.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Is the upload key configured?
        id: check
        # The secrets context is not available in a job-level `if`, so the
        # whole job is a no-op until the three ANDROID_* secrets exist. Nothing
        # secret is printed: only whether the value is empty.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret — skipping the Play bundle."
          fi
        working-directory: .

      - name: Checkout
        if: steps.check.outputs.has_key == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.check.outputs.has_key == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.check.outputs.has_key == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Write the signing key
        if: steps.check.outputs.has_key == 'true'
        # The keystore lands outside the checkout so it can never be picked up
        # by a build step or an artifact upload, and key.properties points at it
        # by absolute path.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"
          chmod 600 "$RUNNER_TEMP/upload-keystore.p12"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.p12"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$STORE_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Read the app version
        id: version
        if: steps.check.outputs.has_key == 'true'
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check.outputs.has_key == 'true'
        run: flutter pub get

      - name: Build app bundle
        if: steps.check.outputs.has_key == 'true'
        # Gradle's failure text lives in the log, which needs a sign-in to read.
        # Keep it and re-emit the tail as an annotation, which does not.
        run: |
          set -o pipefail
          if ! flutter build appbundle --release --dart-define=API_BASE_URL=https://api.qrsafe.flemby.com --dart-define=APP_VERSION=${{ steps.version.outputs.value }} 2>&1 | tee build-bundle.log; then
            # %25 first, or the %0A we add next would itself be escaped.
            message=$(tail -n 80 build-bundle.log | sed -e 's/%/%25/g' | sed -z -e 's/\n/%0A/g')
            echo "::error title=App bundle build failed::$message"
            exit 1
          fi

      - name: Confirm it is signed with the upload key
        if: steps.check.outputs.has_key == 'true'
        # A bundle signed with the debug key is rejected by Play with a message
        # that does not say which key it saw. Fail here instead, where it does.
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
            | grep -i 'Owner:' | head -2
          if keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
               | grep -qi 'CN=Android Debug'; then
            echo "::error::The bundle is signed with the debug key, not the upload key."
            exit 1
          fi

      - name: Remove the signing key
        if: always() && steps.check.outputs.has_key == 'true'
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.p12"

      - name: Upload the bundle
        if: steps.check.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qrsafe-play-bundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  publish-apk:
    name: Publish APK to the download page
    needs: build-apk
    runs-on: ubuntu-latest
    # Real pushes to main only — never a PR from a fork.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: qrsafe-debug-apk
          path: apk

      - name: Add server to known_hosts
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          ssh-keyscan -t ed25519 193.181.211.239 >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install deploy SSH key
        run: |
          install -m 600 /dev/stdin "$HOME/.ssh/deploy_key" <<< "${{ secrets.DEPLOY_SSH_KEY }}"

      - name: Rsync APK to the server
        # The deploy key is locked to `rrsync -wo /var/www/qrsafe-web`, so the
        # path after the colon is relative to that web root. downloads/ is
        # protected from the web deploy's --delete.
        run: |
          cp apk/app-arm64-v8a-release.apk qrsafe.apk
          rsync -vz \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new" \
            qrsafe.apk deploy@193.181.211.239:downloads/qrsafe.apk
