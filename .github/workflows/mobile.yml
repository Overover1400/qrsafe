name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      # Skip doc-only changes — Markdown under mobile/ doesn't affect the build.
      - '!mobile/**.md'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/**.md'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        # Bake the production API URL into the CI artifact. Local dev uses the
        # emulator-localhost default in lib/core/config/env.dart.
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.qrsafe.flemby.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrsafe-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
